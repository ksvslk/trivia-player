name: operation_veritas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.13+15

environment:
  sdk: ^3.5.3

dependencies:
  # Firebase
  firebase_core: ^3.13.0
  firebase_database: ^11.3.5
  cloud_functions: ^5.5.0
  firebase_auth: ^5.5.3
  firebase_analytics: ^11.4.5
  firebase_app_check: ^0.3.2+5

  shared_preferences: ^2.3.5
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  logging: ^1.3.0
  provider: ^6.1.2
  url_launcher: ^6.3.1
  json_annotation: ^4.9.0
  package_info_plus: ^8.3.0
  google_mobile_ads: ^6.0.0
  flutter:
    sdk: flutter
  games_services: ^4.1.1
  web_socket_channel: ^3.0.1
  visibility_detector: ^0.4.0+2
  purchases_flutter: ^8.8.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sfx/
    - assets/images/
  fonts:
    - family: Gabarito
      fonts:
        - asset: fonts/Gabarito-Bold.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-VariableFont_opsz,wght.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: fonts/SpaceGrotesk-VariableFont_wght.ttf
    - family: WorkSans
      fonts:
        - asset: fonts/WorkSans-VariableFont_wght.ttf

